spring.application.name=RuinMIT
server.port=${PORT:8089}

# Database (Neon.tech PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (Base64-encoded 256-bit secret)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Brevo (Email API)
brevo.api.key=${BREVO_API_KEY}

# App
app.frontend.url=${FRONTEND_URL:https://ruinmit.co.in,https://www.ruinmit.co.in}
app.support.email=${SUPPORT_EMAIL:ruinmit69@gmail.com}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.jpa.open-in-view=false